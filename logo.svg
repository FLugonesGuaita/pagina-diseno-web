<svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes para las letras -->
    <linearGradient id="gradientL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradientB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a2be2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtros para efectos de brillo -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Letra L -->
  <path d="M20 15 L20 65 L55 65 L55 55 L35 55 L35 15 Z" 
        fill="url(#gradientL)" 
        stroke="url(#gradientL)" 
        stroke-width="2" 
        filter="url(#glow)"/>
  
  <!-- Letra B con monitor integrado -->
  <g>
    <!-- Parte principal de la B -->
    <path d="M75 15 L75 65 L110 65 C120 65 125 60 125 50 L125 45 C125 40 122 37 118 35 C122 33 125 30 125 25 L125 20 C125 15 120 15 110 15 Z M90 25 L105 25 C108 25 110 27 110 30 C110 33 108 35 105 35 L90 35 Z M90 45 L108 45 C111 45 113 47 113 50 C113 53 111 55 108 55 L90 55 Z" 
          fill="url(#gradientB)" 
          stroke="url(#gradientB)" 
          stroke-width="2" 
          filter="url(#glow)"/>
    
    <!-- Pantalla del monitor dentro de la B -->
    <rect x="95" y="30" width="12" height="8" 
          fill="#001122" 
          stroke="#00d4ff" 
          stroke-width="1" 
          rx="1"/>
    
    <!-- Código dentro de la pantalla -->
    <text x="101" y="36" 
          font-family="monospace" 
          font-size="4" 
          fill="#00d4ff" 
          text-anchor="middle">&lt;/&gt;</text>
  </g>
  
  <!-- Texto LYB -->
  <text x="100" y="90" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="8px">LYB</text>
  
  <!-- Texto WEB DESIGN -->
  <text x="100" y="108" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        font-weight="300" 
        fill="#cccccc" 
        text-anchor="middle" 
        letter-spacing="4px">WEB DESIGN</text>
  
  <!-- Efectos de partículas decorativas -->
  <circle cx="30" cy="25" r="1" fill="#00d4ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="30" r="1" fill="#ff00ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="50" r="0.5" fill="#8a2be2" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="55" r="0.5" fill="#00d4ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>